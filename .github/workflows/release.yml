name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Fails in seconds, before six matrix builds burn CI on a release that would
  # ship a binary lying about its own version — the update check compares
  # CARGO_PKG_VERSION against the latest tag, so the two must never drift.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          cargo_version=$(awk -F'"' '/^\[/{section=$0} section=="[package]" && /^version *=/{print $2; exit}' Cargo.toml)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME wants version $tag_version, Cargo.toml says $cargo_version"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: blackbird
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: blackbird
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: blackbird
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: blackbird
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: blackbird.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: blackbird.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: blackbird-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mv artifacts/blackbird-x86_64-unknown-linux-gnu/blackbird    artifacts/blackbird-${VERSION}-linux-x86_64
          mv artifacts/blackbird-aarch64-unknown-linux-gnu/blackbird   artifacts/blackbird-${VERSION}-linux-arm64
          mv artifacts/blackbird-x86_64-apple-darwin/blackbird         artifacts/blackbird-${VERSION}-macos-x86_64
          mv artifacts/blackbird-aarch64-apple-darwin/blackbird        artifacts/blackbird-${VERSION}-macos-arm64
          mv artifacts/blackbird-x86_64-pc-windows-msvc/blackbird.exe  artifacts/blackbird-${VERSION}-windows-x86_64.exe
          mv artifacts/blackbird-aarch64-pc-windows-msvc/blackbird.exe artifacts/blackbird-${VERSION}-windows-arm64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/blackbird-${{ github.ref_name }}-linux-x86_64
            artifacts/blackbird-${{ github.ref_name }}-linux-arm64
            artifacts/blackbird-${{ github.ref_name }}-macos-x86_64
            artifacts/blackbird-${{ github.ref_name }}-macos-arm64
            artifacts/blackbird-${{ github.ref_name }}-windows-x86_64.exe
            artifacts/blackbird-${{ github.ref_name }}-windows-arm64.exe
