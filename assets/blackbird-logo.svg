<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <rect width="400" height="160" fill="#111111" rx="12"/>

  <!-- bird silhouette, centred at 80,72 -->
  <g transform="translate(80, 72)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="#f59e0b" transform="rotate(-8)"/>
    <!-- head -->
    <ellipse cx="22" cy="-7" rx="10" ry="9" fill="#f59e0b"/>
    <!-- beak -->
    <polygon points="30,-9 46,-8 30,-5" fill="#f59e0b"/>
    <!-- tail -->
    <polygon points="-26,4 -50,0 -48,10 -26,8" fill="#f59e0b"/>
    <!-- upper wing swept back -->
    <path d="M 4,-6 C -10,-30 -32,-34 -48,-22 C -34,-20 -18,-16 -4,-4 Z" fill="#f59e0b"/>
    <!-- lower wing hint -->
    <path d="M -2,5 C -16,18 -34,20 -46,13 C -34,9 -18,5 -2,5 Z" fill="#f59e0b" opacity="0.45"/>
    <!-- eye -->
    <circle cx="24" cy="-9" r="3" fill="#111111"/>
    <!-- frequency wave -->
    <path d="M -54,34 C -46,34 -42,22 -34,22 C -26,22 -22,44 -14,44 C -6,44 -2,26 6,26 C 14,26 18,38 26,38 C 34,38 38,28 46,28 C 54,28 56,34 62,34" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.45" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text
    x="158" y="80"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="500"
    fill="#f59e0b"
    letter-spacing="3"
  >BLACKBIRD</text>

  <!-- tagline -->
  <text
    x="160" y="104"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="400"
    fill="#f59e0b"
    opacity="0.5"
    letter-spacing="3"
  >BLACKBOX ANALYSER</text>
</svg>
