<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#111111" rx="10"/>
  <g transform="translate(32, 30)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="#f59e0b" transform="rotate(-8)"/>
    <!-- head -->
    <ellipse cx="11" cy="-4" rx="6" ry="5" fill="#f59e0b"/>
    <!-- beak -->
    <polygon points="16,-5 24,-4 16,-2" fill="#f59e0b"/>
    <!-- tail -->
    <polygon points="-13,2 -26,0 -25,6 -13,5" fill="#f59e0b"/>
    <!-- upper wing -->
    <path d="M 2,-3 C -5,-16 -18,-18 -26,-12 C -18,-10 -9,-8 -2,-2 Z" fill="#f59e0b"/>
    <!-- lower wing -->
    <path d="M -1,3 C -8,10 -18,11 -24,7 C -18,5 -9,3 -1,3 Z" fill="#f59e0b" opacity="0.45"/>
    <!-- eye -->
    <circle cx="12" cy="-5" r="1.8" fill="#111111"/>
  </g>
</svg>
